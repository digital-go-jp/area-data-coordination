<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="diagramTitle diagramDesc">
  <title id="diagramTitle">09_7-1サービス類型判定フローチャート</title>
  <desc id="diagramDesc">
    元になった基盤の数、利用者の範囲、サービス提供主体の順に条件を選び、
    型2.1から型2.8までのサービス類型を判定するフローチャート。
  </desc>

  <defs>
    <style>
      .background {
        fill: #FFFFFF;
      }

      .column-guide {
        fill: #F3EEE5;
        opacity: 0.58;
      }

      .column-title {
        fill: #0017B6;
        font-family: "Noto Sans JP", sans-serif;
        font-size: 18px;
        font-weight: 700;
        text-anchor: middle;
      }

      .column-subtitle {
        fill: #42506B;
        font-family: "Noto Sans JP", sans-serif;
        font-size: 13px;
        font-weight: 500;
        text-anchor: middle;
      }

      .decision {
        fill: #FFFFFF;
        stroke: #0017B6;
        stroke-width: 3;
        filter: url(#decisionShadow);
      }

      .decision-secondary {
        fill: #C0D7FB;
        stroke: #0017B6;
        stroke-width: 2.5;
        filter: url(#decisionShadow);
      }

      .decision-text {
        fill: #00125F;
        font-family: "Noto Sans JP", sans-serif;
        font-size: 16px;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: middle;
      }

      .result {
        fill: #F3EEE5;
        stroke: #0017B6;
        stroke-width: 2;
        rx: 14;
        filter: url(#resultShadow);
      }

      .result-highlight {
        fill: #0017B6;
        stroke: #0017B6;
        stroke-width: 3;
        rx: 14;
        filter: url(#highlightShadow);
      }

      .result-type {
        fill: #0017B6;
        font-family: "Noto Sans JP", sans-serif;
        font-size: 18px;
        font-weight: 800;
        text-anchor: middle;
      }

      .result-type-light {
        fill: #FFFFFF;
        font-family: "Noto Sans JP", sans-serif;
        font-size: 18px;
        font-weight: 800;
        text-anchor: middle;
      }

      .result-description {
        fill: #24304A;
        font-family: "Noto Sans JP", sans-serif;
        font-size: 14px;
        font-weight: 600;
        text-anchor: middle;
      }

      .result-description-light {
        fill: #FFFFFF;
        font-family: "Noto Sans JP", sans-serif;
        font-size: 14px;
        font-weight: 600;
        text-anchor: middle;
