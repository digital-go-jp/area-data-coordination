        font-family: "Noto Sans JP", sans-serif;
        font-size: 12px;
        font-weight: 800;
        text-anchor: middle;
        dominant-baseline: middle;
      }

      .connector {
        fill: none;
        stroke: #0017B6;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#arrowPrimary);
      }

      .connector-soft {
        fill: none;
        stroke: #7184B9;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#arrowSoft);
